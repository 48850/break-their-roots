<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Statecraft: a Global Politics revision game by Elliot Thevathasan.">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Statecraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: an arcade for revision. Sticky player bar (level, XP, streak) on top; a home screen of deck chips + mode cards; each mode is a full-width stage. One committed night look. */
:root{
  color-scheme:dark;
  --bg:#0e0f1f; --panel:#171933; --panel-2:#20234a; --line:#2e3263;
  --ink:#eef0ff; --ink-2:#aab0dc; --ink-3:#7479a8;
  --gold:#ffd23f; --good:#3ddc97; --bad:#ff5d73; --xp:#8b7bff; --hot:#ff8a3d;
  --f-display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.45;min-height:100vh;
  background-image:radial-gradient(circle at 15% -10%,rgba(139,123,255,.18),transparent 45%),radial-gradient(circle at 110% 20%,rgba(255,210,63,.08),transparent 40%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
/* player bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(14,15,31,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;cursor:pointer}
.logo b{color:var(--gold)}
.lvl{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:0}
.badge{font-family:var(--f-display);font-weight:800;background:var(--xp);color:#fff;border-radius:10px;padding:3px 10px;font-size:14px;white-space:nowrap}
.xpbar{flex:1;height:10px;background:var(--panel-2);border-radius:99px;overflow:hidden;min-width:60px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--xp),#c6bcff);transition:width .5s}
.xpnum{font-size:13px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.streak{font-family:var(--f-display);font-weight:800;color:var(--hot);white-space:nowrap}
.mute{font-size:13px;color:var(--ink-3);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
/* home */
.hero{padding-block:34px 10px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vw,64px);line-height:.95;margin:0 0 10px;text-wrap:balance}
.hero h1 span{color:var(--gold)}
.hero p{color:var(--ink-2);margin:0;max-width:56ch}
.sect{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:28px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:center;background:var(--panel)}
.chip small{color:var(--ink-3);font-weight:400;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,210,63,.12)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mode{text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s;min-height:150px}
.mode:hover{transform:translateY(-3px);border-color:var(--c,var(--gold))}
.mode .ic{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--c,var(--gold));line-height:1}
.mode h3{font-family:var(--f-display);font-weight:800;font-size:21px;margin:4px 0 0}
.mode p{margin:0;color:var(--ink-2);font-size:14.5px}
.mode .best{margin-top:auto;font-size:13px;color:var(--ink-3);padding-top:8px}
.mastery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:40px}
.mastery div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mastery b{display:block;font-size:14.5px}
.mastery .m{height:6px;background:var(--panel-2);border-radius:99px;margin-top:8px;overflow:hidden}
.mastery .m i{display:block;height:100%;background:var(--good)}
.mastery .m{padding:0;border:0}.mastery .m.seg{display:flex}.mastery .m.seg i{flex:none}
.mastery small{color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}
/* stage */
.stage{padding-block:22px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.back{border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink-2);font-size:14px}
.hud{display:flex;gap:16px;font-family:var(--f-display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.hud span{color:var(--ink-3);font-size:12px;letter-spacing:.1em;display:block;font-family:var(--f-body);font-weight:700}
.timer{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--gold);transition:width .1s linear}
.prompt{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:22px;font-size:clamp(19px,2.8vw,25px);font-weight:700;line-height:1.3;margin-bottom:14px}
.prompt small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;font-weight:700}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel-2);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;display:flex;gap:12px;align-items:flex-start;transition:transform .1s}
.opt:hover{border-color:var(--ink-3)}
.opt kbd{font-family:var(--f-display);font-weight:800;background:var(--bg);border-radius:6px;padding:0 7px;color:var(--ink-3);flex:none}
.opt.right{border-color:var(--good);background:rgba(61,220,151,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(255,93,115,.15)}
.combo{font-family:var(--f-display);font-weight:800;color:var(--hot)}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.12)}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* flashcard */
.fc{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;min-height:300px;padding:28px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none}
.fc .q{font-size:clamp(20px,3vw,27px);font-weight:700;text-align:center;line-height:1.3}
.fc .a{display:none;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-2);font-size:18px}
.fc.on .a{display:block}.fc.on .q{font-size:20px}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{font-family:var(--f-display);font-weight:800;border-radius:12px;padding:12px 20px;font-size:16px;border:1.5px solid var(--line);background:var(--panel-2)}
.btn.good{background:var(--good);color:#06281a;border-color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.gold{background:var(--gold);color:#2b2100;border-color:var(--gold)}
.btn:disabled{opacity:.35;cursor:default}
.hint{text-align:center;color:var(--ink-3);font-size:13px;margin-top:10px}
/* match */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:14px;line-height:1.3;min-height:96px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:opacity .3s,transform .15s}
.tile i{font-style:normal;font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.12em;color:var(--ink-3)}
.tile.q{border-color:#3d4280}.tile.q i{color:var(--xp)}
.tile.sel{border-color:var(--gold);transform:translateY(-2px);background:rgba(255,210,63,.1)}
.tile.gone{opacity:0;pointer-events:none;transform:scale(.9)}
.tile.no{border-color:var(--bad)}
/* boss */
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.fighter{display:flex;flex-direction:column;gap:6px;min-width:0}
.fighter b{font-family:var(--f-display);font-weight:800;font-size:17px}
.hp{height:12px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--bad);transition:width .4s}
.hearts{color:var(--bad);font-size:20px;letter-spacing:3px}
.vs{font-family:var(--f-display);font-weight:800;color:var(--ink-3)}
.bossface{font-family:var(--f-display);font-weight:800;font-size:44px;text-align:right;line-height:1}
.dmg{font-family:var(--f-display);font-weight:800;color:var(--gold);min-height:22px;text-align:right}
@media (max-width:560px){.arena{grid-template-columns:1fr;}.vs{display:none}.bossface,.dmg{text-align:left}}
/* tf */
.tf{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:24px;min-height:220px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.tf .q{font-size:clamp(18px,2.6vw,23px);font-weight:700}
.tf .a{color:var(--ink-2);font-size:17px;border-left:3px solid var(--xp);padding-left:12px}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tfrow .btn{padding:18px;font-size:20px}
/* results */
.res{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:26px;text-align:center}
.res h2{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,44px);margin:0 0 6px}
.res .big{font-family:var(--f-display);font-weight:800;font-size:56px;color:var(--gold);line-height:1;margin:10px 0}
.review{text-align:left;margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.review div{padding:10px 0;border-bottom:1px solid var(--line)}
.review b{display:block}.review span{color:var(--good)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--xp);color:#fff;font-family:var(--f-display);font-weight:800;padding:10px 18px;border-radius:99px;z-index:20;transition:transform .35s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}

/* typing */
.typebox{display:flex;gap:10px;margin:12px 0;align-items:stretch}
.typebox textarea{flex:1;min-width:0;background:var(--panel-2);border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;font-size:16px;padding:12px 14px;resize:vertical}
.typebox textarea:focus{outline:none;border-color:var(--gold)}
.typebox .btn{flex:none}
@media (max-width:520px){.typebox{flex-direction:column}}
mark.hit{background:rgba(61,220,151,.22);color:var(--good);border-radius:4px;padding:0 2px}
mark.miss{background:rgba(255,93,115,.18);color:#ffb3be;border-radius:4px;padding:0 2px}
.feedback{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:6px}
.feedback p{margin:10px 0 0;color:var(--ink-2);font-size:16.5px}
b.good{color:var(--good)} b.part{color:var(--gold)} b.bad{color:var(--bad)}
.verdict{margin-top:10px;font-size:14px;color:var(--ink-3)}
.prompt.special{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,63,.15)}
/* animated boss arena */
.hudrow{display:flex;justify-content:space-between;gap:16px}
.hudrow .pl,.hudrow .bs{display:flex;flex-direction:column;gap:4px;min-width:0}
.hudrow .bs{align-items:flex-end;flex:0 1 55%}
.hudrow b{font-family:var(--f-display);font-weight:800}
.hudrow .hp{width:100%;min-width:120px}
.hudrow small{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
  background:radial-gradient(ellipse at 50% 100%,rgba(139,123,255,.18),transparent 60%),linear-gradient(transparent 82%,rgba(255,255,255,.05) 82%)}
@keyframes breathe{50%{transform:scaleY(.97)}}
@keyframes bob{50%{transform:translateY(-8px) scale(1.02,.98)}}
@keyframes cast{40%{transform:rotate(-35deg)}100%{transform:rotate(0)}}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}90%{opacity:1}100%{opacity:0;transform:translate(var(--dx,300px),var(--dy,0px)) scale(1.3)}}
@keyframes monhurt{0%{filter:brightness(3) saturate(0)}30%{transform:translateX(14px) rotate(6deg)}60%{transform:translateX(-8px) rotate(-3deg);filter:none}100%{transform:none}}
@keyframes lunge{40%{transform:translateX(-46%) scale(1.12)}100%{transform:none}}
@keyframes hurt{0%,100%{filter:none}30%{filter:drop-shadow(0 0 10px var(--bad)) brightness(1.6);transform:translateX(-10px) rotate(-6deg)}}
@keyframes defeat{30%{transform:rotate(12deg) scale(1.1);filter:brightness(2)}100%{transform:rotate(-30deg) scale(0) translateY(40px);opacity:0}}
@keyframes rise{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-60px) scale(1)}}
@keyframes say{0%{opacity:0;transform:translate(-50%,6px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes quake{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

/* illustrated boss arena */
.arena3{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:12px 12px 12px;margin-bottom:14px;overflow:hidden}
.arena3 .hudrow{padding:0 4px 10px}
.scene{position:relative;width:100%;aspect-ratio:1672/941;border-radius:14px;overflow:hidden;background:#0b0c18;isolation:isolate}
.cam{position:absolute;inset:0;animation:drift 14s ease-in-out infinite alternate}
.ly{position:absolute;inset:0;background:var(--img) center/cover no-repeat}
.bossl,.herol{-webkit-mask-image:var(--mask);mask-image:var(--mask)}
.bossl{animation:loom 2.8s ease-in-out infinite}
.bossl.hurt{animation:bhurt .55s}
.bossl.lunge{animation:blunge .6s cubic-bezier(.5,0,.3,1)}
.bossl.dead{animation:bdead 1.4s forwards}
.herol{transform-origin:20% 90%}
.herol.strike{animation:hstrike .45s ease-out}
.herol.hurt{animation:hhurt .5s}
.herol.down{animation:none;transform:translateY(6%) rotate(-4deg);filter:grayscale(1) brightness(.6);transition:transform .8s,filter .8s}
.scene.lost .base,.scene.lost .bossl{filter:saturate(.4) brightness(.7);transition:filter .8s}
.slash{position:absolute;left:var(--tx);top:var(--ty);width:18%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(-30deg) scale(.3);border-radius:50%;border:6px solid transparent;border-top-color:#fff6c8;filter:drop-shadow(0 0 10px var(--gold));opacity:0;pointer-events:none}
.slash.go{animation:slash .4s ease-out}
.orb2{position:absolute;left:var(--tx);top:var(--ty);width:5%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;
  background:radial-gradient(circle,#fff,var(--gold) 45%,rgba(255,210,63,0) 72%);box-shadow:0 0 26px 10px rgba(255,210,63,.6)}
.orb2.big{width:8%;box-shadow:0 0 40px 16px rgba(255,138,61,.7)}
.orb2.fly{animation:fly2 .4s ease-in forwards}
.burst{position:absolute;left:var(--cx);top:var(--cy);width:30%;aspect-ratio:1;transform:translate(-50%,-50%) scale(0);border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,210,63,.6) 30%,rgba(255,93,115,0) 65%)}
.burst.pop{animation:burst .5s ease-out}
.floats2{position:absolute;left:var(--cx);top:var(--cy);width:0;height:0;pointer-events:none}
.fl2{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:800;white-space:nowrap;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.8);animation:rise2 1.1s ease-out forwards}
.fl2.dmg{color:var(--gold);font-size:clamp(22px,4vw,40px)} .fl2.crit{color:var(--hot);font-size:clamp(28px,5.5vw,54px)} .fl2.critx{color:#fff;font-size:clamp(12px,1.8vw,18px);letter-spacing:.12em;top:clamp(26px,4vw,46px)}
.fl2.ouch{color:var(--bad);font-size:clamp(20px,3.6vw,36px);left:-38vw;top:12vw}
.taunt2{position:absolute;left:var(--cx);top:4%;transform:translateX(-50%);background:#fff;color:#14152b;font-weight:700;font-size:clamp(11px,1.6vw,15px);padding:5px 12px;border-radius:12px;opacity:0;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.taunt2.say{animation:say 1.9s ease forwards}
.vig{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 90px 30px rgba(255,40,60,.85)}
.vig.flash{animation:vig .6s ease-out}
.stamp2{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-8deg) scale(2.2);font-family:var(--f-display);font-weight:800;font-size:clamp(30px,7vw,72px);color:var(--gold);border:5px solid var(--gold);padding:2px 18px;border-radius:10px;opacity:0;pointer-events:none;text-shadow:0 3px 0 #000;background:rgba(0,0,0,.35)}
.stamp2.bad{color:var(--bad);border-color:var(--bad)}
.stamp2.show{animation:stamp2 .45s cubic-bezier(.3,1.6,.5,1) forwards}
.cam.quake{animation:quake .45s}
.cam.kick{animation:kick .35s}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.06) translate(-1%,.5%)}}
@keyframes loom{50%{transform:scale(1.015)}}
@keyframes bhurt{0%{filter:brightness(2.6) saturate(.2)}25%{transform:translate(1.5%,-.5%)}50%{transform:translate(-1%,.5%);filter:brightness(1.4) hue-rotate(-20deg)}100%{transform:none;filter:none}}
@keyframes blunge{40%{transform:scale(1.1) translate(-4%,3%);filter:brightness(1.3) drop-shadow(0 0 20px rgba(255,40,60,.8))}100%{transform:none}}
@keyframes bdead{0%{filter:brightness(3)}20%{transform:translate(1%,0)}30%{transform:translate(-1%,0)}100%{filter:grayscale(1) brightness(.35) blur(1px);transform:scale(.97) translateY(2%)}}
@keyframes hstrike{35%{transform:translate(2.5%,-1%) rotate(1.5deg)}100%{transform:none}}
@keyframes hhurt{0%,100%{filter:none;transform:none}30%{filter:brightness(1.4) saturate(1.6);transform:translate(-1.5%,.5%) rotate(-1.5deg)}}
@keyframes slash{0%{opacity:1;transform:translate(-50%,-50%) rotate(-60deg) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) rotate(40deg) scale(1.1)}}
@keyframes fly2{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}85%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.4)}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
@keyframes rise2{0%{opacity:0;margin-top:10px}20%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-60px}}
@keyframes vig{0%{opacity:1}100%{opacity:0}}
@keyframes stamp2{to{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
@keyframes kick{30%{transform:scale(1.07)}100%{transform:scale(1.04)}}

/* AI judge feedback */
.feedback .jhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.feedback .jhead b{font-family:var(--f-display);font-size:20px}
.jscore{font-family:var(--f-display);font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.by{margin-left:auto;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--xp);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.jfb{margin:10px 0 0;color:var(--ink);font-size:16.5px}
.missing{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.missing small,.model small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;width:100%}
.missing span{background:rgba(255,93,115,.14);border:1px solid rgba(255,93,115,.4);color:#ffc2cb;border-radius:8px;padding:3px 8px;font-size:14px}
.model{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);color:var(--ink-2);font-size:15.5px}
.jnote{margin:10px 0 0;font-size:13px;color:var(--ink-3)}
.feedback.thinking{color:var(--ink-2);display:flex;align-items:center;gap:10px}
.gavel{display:inline-block;color:var(--gold);font-size:20px;animation:gavel .8s ease-in-out infinite}
@keyframes gavel{50%{transform:rotate(-25deg)}}

/* confidence buttons (Brainscape-style) */
.confq{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--ink-2);margin:16px 0 8px;text-align:center}
.conf{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cbtn{border:2px solid var(--cc);background:color-mix(in srgb,var(--cc) 12%,var(--panel));color:var(--ink);border-radius:12px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,background .15s}
.cbtn b{font-family:var(--f-display);font-size:22px;line-height:1;color:var(--cc)}
.cbtn span{font-size:12px;color:var(--ink-2);white-space:nowrap}
.cbtn:not(:disabled):hover{transform:translateY(-2px);background:color-mix(in srgb,var(--cc) 26%,var(--panel))}
.cbtn:disabled{opacity:.3;cursor:not-allowed}
.cbtn.sug{background:var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 35%,transparent)}
.cbtn.sug b,.cbtn.sug span{color:#121225}
.cbtn.sug::after{content:'suggested';font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#121225;font-weight:700}
.feedback .conf{margin-top:2px}
.ovrow{margin-top:10px}.ovrow .btn{font-size:14px;padding:9px 14px}
.fbk p{margin:10px 0 0;color:var(--ink);font-size:16px}
.fbk small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.fbk .ok small{color:var(--good)} .fbk .fix small{color:var(--gold)}
@media (max-width:520px){.conf{gap:5px}.cbtn{padding:9px 2px 8px}.cbtn span{font-size:10.5px;white-space:normal;text-align:center;line-height:1.15}.cbtn.sug::after{font-size:8.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

on (e.g. a president, police officer, mayor)"], ["Charismatic authority?", "Rooted in a leader's personal qualities and popularity; hard to pass on when they die (e.g. Churchill, Hitler, a social media personality)"], ["Ideology?", "A system of ideas and values that forms the basis of economic, political or social theory and policy (usually ending in -ism)"], ["Three things all ideologies do?", "Make assumptions about human nature and society; create universal values to guide decisions; advocate an ideal society"], ["Liberalism: view of human nature?", "Humans are rational and motivated by enlightened self-interest; happiest pursuing their own desires as long as they don't harm others"], ["Liberalism: ideal society?", "Minimal government interference; laws and institutions protecting individual freedoms, free markets and equal rights"], ["Socialism: view of human nature?", "Humans are social, cooperative creatures who feel responsible for others and work best together"], ["Socialism: ideal society?", "Equality: equal access to services, communally owned means of production, reduced inequality so class (and race) divisions disappear"], ["Conservatism: view of human nature?", "Humans are emotional, irrational, naturally selfish and violent; traditions evolved over generations keep these tendencies in check"], ["Conservatism: ideal society?", "Government protects traditional institutions, religion, gender roles and customs; traditional rulers lead; change is gradual"], ["Edmund Burke's view of society (1790)?", "Society is a partnership \"between those who are living, those who are dead and those who are to be born\", not a disposable contract, so don't change it radically"], ["Political system?", "The organisation and structure used to govern a society: its institutions and processes for managing power, authority and decisions"], ["Full (liberal) democracy (Zakaria)?", "\"Free and fair elections but also the rule of law, separation of powers and the protection of basi in the 1980s; head of the FSB under Yeltsin; became PM in 1999 and president when Yeltsin resigned (Dec 1999), elected 2000"], ["How did Putin centralise power after 2000?", "Cut regional powers, reduced the parties allowed to run, took control of TV and the internet, and renationalised up to 70% of the economy"], ["How did Putin deal with the oligarchs?", "They could keep making money if they stayed out of politics; loyalists kept their empires, while opponents were arrested and had assets seized"], ["How did Putin get around term limits?", "PM 2008–12 (tandem with Medvedev); returned in 2012 with 6-year terms; 2020 amendments allow two more terms, so potentially in power to 2036"], ["How did the Chechen war help Putin?", "Crushing the independence-seeking region made him look like a strong leader and boosted his popularity"], ["Putin's quote about the USSR's collapse?", "\"The greatest geopolitical catastrophe\" of the 20th century"], ["How has Putin kept control of elections? (Freedom House 2024)", "Preferential media coverage; rivals disqualified (e.g. Navalny 2018); electoral laws and timing manipulated; \"foreign agents\" barred; opaque online voting"], ["What is United Russia?", "Putin's party; won 324 of 450 Duma seats in 2021, a supermajority; other parties are Kremlin-approved \"opposition\""], ["Why does Putin hold elections if they are not free?", "To give his rule legitimacy at home and abroad and show apparent popular support"], ["Democratic features of Russia's system (on paper)?", "A constitution, elected Duma, multiple parties, federal structure"], ["Evidence Russia is authoritarian?", "Super-powerful president, no real term limits, controlled media, banned or jailed opposition, rigged elections, crackdowns on protest"], ["What is Russian exceptionalism?", "The belief that Russia is a unique civilisation of all Russian speakers, fundamentally different from the West and threatened by outside forces"], ["What is Putin's anti-liberalism?", "The claim that the West is decadent and has abandoned Christian and family values, so Russia must resist Western culture"], ["Examples of Putin's social and cultural policies?", "2013 anti-LGBTQI+ \"propaganda\" law; patriotic curriculum and rewritten textbooks (2023); military lessons and Family Studies (2024); censorship; pro-birth policies"], ["What is Russia's 2013 \"gay propaganda\" law?", "Bans promoting \"non-traditional sexual relationships\" to minors; people fined or jailed for rainbow symbols; hate crimes up about 300%"], ["What is Russia's \"foreign agent\" law (2012)?", "Any group with outside support can be labelled a foreign agent and fined or shut down"], ["Why is Russia promoting traditional roles for women?", "To reverse a falling birth rate: cash payments to mothers, restricted abortion and contraception, a ban on promoting \"child-free\" lifestyles"], ["Consequences of Russia's population decline?", "Ageing population, fewer young workers, brain drain; worsened by deaths in the Ukraine war"], ["Who was Aleksey Navalny?", "Anti-corruption activist and Putin's leading critic; blogger with over 1 million monthly views by 2010"], ["How did Navalny challenge United Russia in 2011?", "Told followers to vote for any party but United Russia, which fell below 50% for the first time"], ["How did the state silence Navalny? (timeline)", "2013 embezzlement conviction; 2016 his party deregistered; 2018 barred from presidency; 2020 poisoned with Novichok; 2021 arrested on return; died in the IK-6 Arctic prison (2024)"], ["What does Navalny's case show about Russia?", "It is authoritarian: courts, poison and prison are used to remove genuine opposition"], ["What is Russia's \"Near Abroad\"?", "The former Soviet republics, which Russia claims as its sphere of influence and essential to its security"], ["Which post-Soviet states joined NATO and the EU in 2004?", "The Baltic states: Lithuania, Latvia and Estonia"], ["Which post-Soviet states remain close to Moscow?", "Belarus, Turkmenistan and other authoritarian states"], ["Why does Russia have leverage in the Near Abroad?", "Economic dependence on Russia, plus large Russian-speaking minorities (over 30% in some states) that complicate national identity"], ["Where has Russia intervened militarily in former Soviet states?", "Moldova (1990–92), Georgia (2008), Ukraine (2014 and 2022)"], ["How does Russia's Foreign Policy Concept describe the West?", "Calls globalisation and democratisation \"imperialism\" and \"neo-colonialism\"; accuses the West of an \"aggressive anti-Russian policy\" to \"destroy Russia\"; lists 48 \"unfriendly\" countries"], ["How does Russia interfere in Western elections?", "Internet Research Agency hacking; fake bots and profiles amplifying division on both left and right; RT propaganda; funding pro-Russian parties and influencers; tried to influence 11 elections in 9 democracies (2020–22)"], ["What was Russia's \"Doppelganger\" campaign?", "A disinformation operation imitating real Western news sites and pushing divisive content, including around the 2024 US election"], ["What is BRICS?", "A 2011 bloc of Brazil, Russia, India, China and South Africa; expanded in 2024 (Egypt, Ethiopia, Indonesia, Iran, UAE) as a non-Western economic alternative based on non-interference"], ["Which authoritarian regimes has Russia supported?", "Assad in Syria (2011–24); North Korea and Iran, which supply weapons for Ukraine in exchange for diplomatic support"], ["What are Russian PMCs?", "Private military companies (e.g. Wagner) linked to the Kremlin, giving deniable training, weapons and troops, especially in Africa"], ["What is Russia's \"anti-colonial\" strategy in Africa?", "Presents Russia as fighting Western neo-colonialism (e.g. the 2024 \"For the Freedom of Nations\" forum) while using disinformation via RT, TASS and Sputnik to win influence"], ["Isolationist foreign policy?", "Avoiding foreign entanglements and military alliances; prioritising domestic issues and the economy"], ["Interventionist foreign policy?", "Playing an active role in world affairs, spreading ideals by diplomacy or force, and protecting allies (acting as \"world policeman\")"]]}, {"name": "China", "boss": "The Red Dragon", "cards": [["China: population and world rank?", "1.41 billion (2nd largest in the world)"], ["China: total GDP and share of world GDP?", "$19.4 trillion, about 19% of world GDP"], ["China: GDP per capita and HDI?", "About $12,969 per capita (70th); HDI 0.788 (high, 75th)"], ["Why is China still classed as a developing nation?", "Mid-range HDI (0.788) and Gini (38.2, 67th of 154) and a low GDP per capita (~$13,000) despite a huge total GDP"], ["What is the Hu line?", "A line dividing China's dense east from its sparse west; about 94% of the population lives on the eastern side of it (the slide wording says west, but the populous side is the east)"], ["Largest ethnic group in China?", "Han Chinese, about 91% of the population; 55 recognised minorities (e.g. Tibetans, Uyghurs) make up the rest"], ["Who led the Guomindang (GMD/Nationalists) in the Chinese Civil War?", "Chiang Kai-shek (GMD controlled the Republic of China from 1927, ruling from Nanjing)"], ["Who led the Chinese Communist Party (CCP) in the Civil War?", "Mao Zedong"], ["How did the Second Sino-Japanese War (1937–45) affect the Civil War?", "The GMD and CCP formed a united front against Japan; fighting resumed once Japan was defeated"], ["Why did the Communists win the Civil War? (4 reasons)", "Mao's strong leadership and loyal generals; PLA guerrilla tactics the GMD couldn't counter; land reform won peasant support; GMD corruption, poor leadership and low morale"], ["When was the People's Republic of China proclaimed?", "October 1949, by Mao Zedong (Chiang's GMD government fled to Taiwan in early 1949)"], ["What is Taiwan's official name and origin?", "Republic of China; set up by the defeated GMD after 1949, claiming to be the rightful government of all China"], ["Until when did the UN recognise Taiwan as China's government?", "1971 (Taiwan held China's UN Security Council seat and veto until then)"], ["What is the One China Principle?", "Beijing's position that Taiwan is a breakaway province of China; it refuses relations with any country that recognises Taiwan as independent"], ["What is the US position on Taiwan's sovereignty?", "An \"as yet unsettled issue\": the US rejects Beijing's claim and does not recognise Taiwan as independent; both sides should resolve it peacefully (while the US keeps an unofficial alliance with Taiwan)"], ["Why is Taiwan a flashpoint between China and the West?", "China says it may use force to take Taiwan; most Taiwanese want independence; Taiwan is a US partner, so a China–Taiwan war would likely draw in the US"], ["How does China's constitution describe its system of government?", "A \"people's democratic dictatorship\": the CCP acts for the people but uses dictatorial powers to prevent counter-revolution"], ["What is the National People's Congress (NPC)?", "China's legislature (~3,000 indirectly elected delegates, meeting two weeks a year); officially the \"highest organ of state power\", in reality a rubber stamp for the CCP"], ["What is the Politburo?", "The CCP's top decision-making body (about 25 members) that holds real political power"], ["What is the Politburo Standing Committee?", "The inner group of seven within the Politburo that makes the major decisions"], ["What are the 4 key aspects of China's political system (Brazilian Centre for International Relations, 2021)?", "1) Authoritarianism (power in a small unelected elite) 2) Party-state (CCP controls government, economy, media, society) 3) Meritocracy (career officials promoted on skill and loyalty) 4) Democratic features (grassroots and intra-party democracy, civilian control of military)"], ["How does meritocracy work in the CCP?", "Officials must score well on university exams and serve in local government before promotion, so leaders are experienced, knowledgeable and loyal"], ["Roughly how many members did the CCP have in 2024?", "About 99 million"], ["What is \"One Party, Two Coalitions\"?", "Two CCP factions that both keep the party in power: Princelings (children of revolutionary elites; represent business and the coastal middle class) and Populists/tuanpai (humble origins; represent the urban and rural poor)"], ["Why did the CCP try to spread power after the 1990s?", "To avoid another Mao-style personality cult and Cultural Revolution excesses, and to answer public anger over corruption (e.g. 1989 Tiananmen Square protests)"], ["How has Xi Jinping concentrated power since 2013? (4 ways)", "Anti-corruption campaigns that remove rivals; removal of term limits (third term, 2022); stacking the Politburo with loyalists; \"Xi Jinping Thought\" and a personality cult, plus tighter censorship"], ["Which faction is Xi Jinping from?", "The Princeling faction (his father was a revolutionary hero)"], ["What three top posts does Xi hold?", "General Secretary of the CCP, President of China, Chairman of the Central Military Commission"], ["What is the Chinese Dream?", "Xi's 2013 vision for the \"great rejuvenation of the Chinese nation\", reversing the century of humiliation and restoring China's dominance in Asia"], ["What was the \"century of humiliation\" (century of shame)?", "Foreign encroachment on China, roughly 1839/1849–1949, when Western powers and Japan weakened China, exploited it and took territory"], ["The four parts of the Chinese Dream?", "Strong China (economy, military, technology); Civilised China (pride in traditional culture, not Western ideas); Harmonious China (class unity under the CCP); Beautiful China (sustainable development, less pollution)"], ["What are the \"Two Centenaries\" goals?", "A \"moderately well-off society\" by 2021 (CCP centenary) and a \"fully developed nation\" by 2049 (PRC centenary)"], ["What is Made in China 2025?", "A 2015 policy to shift China from the \"world's factory\" to an innovation-driven economy, promoting 10 high-tech industries (EVs, renewables, robotics, biomedicine, AI) through subsidies and targets"], ["China's share of world EVs, wind turbines and solar panels?", "About 60% of electric cars, 60% of wind turbines and 80% of solar panels"], ["Criticisms of Made in China 2025?", "Accused of intellectual property theft and forced technology transfer from foreign firms; reliant on state subsidies; other countries now restricting technology and subsidising their own industries"], ["How much did China's GDP grow 2012–2021?", "From $8.5 trillion to $17.7 trillion (more than doubled); average income roughly doubled to ~$12,000"], ["How many people has China lifted out of poverty since the 1970s?", "Over 800 million; in 2021 the government declared extreme poverty eradicated (growth concentrated in eastern cities)"], ["What is the Great Firewall?", "China's internet censorship system that blocks Western websites, forcing use of Chinese apps (WeChat, Weibo) and filtering terms like \"democracy\" and \"Taiwan independence\""], ["What is China's social credit system?", "A planned national system giving citizens a score that rises or falls with behaviour; high scores are rewarded, low scores punished, using financial, government and online data and facial recognition"], ["Examples of human rights restrictions in China?", "Censorship and surveillance; persecution of unregistered religious groups; detention of activists; Hong Kong arrests (e.g. Jimmy Lai of Apple Daily, 2020); policing citizens abroad"], ["What is the Political Security Protection Bureau?", "A secret unit of China's Ministry of Public Security that tracks and silences CCP critics worldwide, including in Australia (ABC Four Corners, 2024)"], ["What is the United Front Work Department (UFWD)?", "The CCP's main foreign influence arm, increasing China's influence abroad through community groups in the diaspora"], ["5 principles of Chinese foreign policy under Xi?", "1) China was a victim of Western imperialism 2) China is returning to great power status 3) China must regain lost territory 4) Peaceful coexistence and non-interference 5) The West is trying to contain China's rise"], ["What is the Belt and Road Initiative (BRI)?", "Xi's 2013 global infrastructure program (railways, ports, pipelines, highways) funded by Chinese loans, linking China with Asia, Europe, Africa, Oceania and Latin America"], ["Scale of the BRI?", "147 countries; two-thirds of world population and ~40% of global GDP; $1–8 trillion spent 2013–2023"], ["China's motives for the BRI?", "Develop Xinjiang and western China; secure energy supplies; gain leverage over other countries (e.g. not recognising Taiwan); expand influence"], ["Criticisms of the BRI?", "Debt trap fears (debts can be called in); dependence on China; projects may serve Chinese military expansion; mainly serves China's interests"], ["BRI examples?", "Addis Ababa–Djibouti railway (Ethiopia); Gwadar port, China–Pakistan Economic Corridor; Kenya's $3bn railway; railways in Indonesia"], ["Deng Xiaoping's foreign policy approach?", "\"Keep a cool head and maintain a low profile. Never take the lead\": prioritise development, avoid disputes, build ties with the US"], ["Examples of China's more assertive foreign policy under Xi?", "Artificial islands in the South China Sea (since 2014); clashes with the Philippines coast guard; Xi: Taiwan reunification \"inevitable\" (2019); 153-aircraft exercise near Taiwan (Oct 2024); India border clashes 2021–22"], ["What is \"wolf warrior\" diplomacy?", "Aggressive, nationalist Chinese diplomacy: pushing back hard on criticism, storming out of meetings, insulting foreign officials; unpopular abroad but popular at home"], ["Russia vs China political systems: similarities?", "Both centralise power in one lifelong leader (Putin, Xi), ban protests, censor media and the internet, and pursue critics overseas"], ["Russia vs China: key differences?", "China is openly one-party; Russia claims multi-party democracy that Putin controls. China is a manufacturing giant tied to world markets; Russia relies on oil and gas exports. Russia's foreign policy is more openly anti-Western"]]}, {"name": "European Union", "boss": "The Bureaucrat Queen", "cards": [["What is the European Union?", "An economic and political union of 27 sovereign states; not a state itself, so members keep their own institutions, courts, militaries and laws"], ["EU: population and GDP?", "About 449 million people (3rd largest if one state); about $20 trillion GDP (16% of world GDP)"], ["EU: average GDP per capita, HDI, Gini?", "About $45,000; HDI 0.903; Gini 29.6, with big variations between members"], ["Most and least developed parts of Europe?", "North-western Europe is most developed; Eastern Europe is least (lower HDI and GDP per capita)"], ["Why did Europeans unite after WW2? (4 reasons)", "To rebuild war-destroyed economies; to prevent a third war by binding economies together; to settle disputes through shared institutions; to build a common identity that weakens extreme nationalism"], ["What was the ECSC?", "European Coal and Steel Community (1951 Treaty of Paris, in force 1952): pooled coal and steel with no tariffs and a binding High Authority, making war \"materially impossible\""], ["Six founding members of the ECSC?", "France, West Germany, Italy, Belgium, the Netherlands, Luxembourg"], ["What was the Schuman Declaration (1950)?", "Robert Schuman's plan for the ECSC: pool coal and steel under a High Authority to end France–Germany antagonism and lay the groundwork for European federation and peace"], ["What did the Treaty of Rome (1957) create?", "The European Economic Community (EEC): a common market with no internal tariffs and aligned trade, agriculture and transport policies"], ["How fast did Western Europe grow in the 1960s?", "About 4% a year on average, which attracted new members"], ["Who had joined the EEC by 1990?", "The UK, Denmark, Ireland (1973), Greece, Spain and Portugal, making 12 members"], ["What did the Maastricht Treaty (1992) do?", "Created the European Union, with EU citizenship, deeper economic and political union, and a common foreign and security policy"], ["What are the \"four freedoms\" of the single market?", "Free movement of goods, people, services and capital"], ["When was the euro adopted?", "1999, by 11 countries (now about 20 use it)"], ["What is the Schengen Area?", "The EU's passport-free travel zone (the UK never joined)"], ["Eastern expansion of the EU?", "From 2004, formerly communist states joined (e.g. Poland, Hungary, Czechia, the Baltic states, Romania, Bulgaria, Croatia), 13 new members by 2013–15"], ["Why was eastern expansion difficult?", "New members were much poorer and lacked strong democratic traditions and institutions"], ["Countries applying to join the EU?", "Albania, Bosnia, Georgia, Moldova, North Macedonia, Serbia, Turkey, Ukraine"], ["Unitary state?", "Power concentrated in the national government; regions just implement national laws (most states)"], ["Federation?", "Power shared between national and regional governments, each with its own laws and courts (e.g. USA, Australia)"], ["Confederation?", "A loose union where regional governments hold most power and can veto national decisions (e.g. the 13 American colonies); the EU is sometimes described this way"], ["Benefits of EU membership (CFR, 2023)?", "The average citizen is €840 a year richer from the single market; the euro boosts tourism and cheap borrowing; more bargaining power in trade deals"], ["Criticisms of the EU (CFR, 2023)?", "Brussels as an overbearing \"nanny state\" eroding sovereignty; Greece angry at budget demands; Hungary rejecting migration quotas; Poland dismissing criticism over its courts"], ["European Council: who and what?", "Heads of state or government of the 27 members, meeting at least 4 times a year; sets the EU's direction and priorities by consensus"], ["European Parliament: who and what?", "720 MEPs directly elected by citizens, seats by population (Germany 96, Luxembourg 6); grouped by ideology; adopts laws and the budget with the Council of the EU"], ["Council of the European Union: who and what?", "Ministers from each member state; with Parliament adopts laws and the budget; coordinates foreign policy and concludes international agreements"], ["European Commission: who and what?", "The EU's executive: 27 commissioners (one per state) who propose laws, allocate funds, enforce EU law and implement decisions; must not hold national political roles"], ["Which EU bodies form its legislature?", "The European Parliament and the Council of the European Union together (with the European Council setting the agenda)"], ["Major groups in the European Parliament?", "European People's Party (centre-right); Socialists and Democrats (centre-left); Europe of Sovereign Nations (nationalist/far-right, e.g. AfD); The Left"], ["Criticisms of the EU's political system?", "Too complicated with nobody in charge; slow and bureaucratic (laws can take years); about €114m a year moving between Strasbourg and Brussels; MEPs can't initiate laws; seen as undemocratic and opaque"], ["Why didn't Britain join the ECSC or EEC at first?", "Less damaged by WW2, strong Commonwealth trade, and a tradition of staying out of European affairs"], ["Why did Britain apply to join the EEC in 1960?", "Losing its colonies and economic decline while France and Germany grew; tariffs hurt British exports to its biggest market"], ["Who blocked Britain's entry, and when did it join?", "France blocked it (1960s), citing different values; Britain joined the EEC in 1973"], ["Result of the 1975 UK referendum?", "67% voted to remain after Harold Wilson renegotiated the terms"], ["Which parts of the EU did Britain avoid?", "The euro and Schengen; it supported the common market but not political or monetary union"], ["Why did British Euroscepticism grow in the 2000s?", "Resentment at funding poorer new members; Eastern European migration seen as taking jobs; fear of losing control to unelected EU bureaucrats"], ["Who called the Brexit referendum and when?", "PM David Cameron, announced in 2013, held 23 June 2016"], ["Remain campaign arguments?", "Prosperity (the EU bought 44% of UK exports); global standing as part of 500 million people; freedom to live, work and study across the EU"], ["Leave campaign arguments?", "Sovereignty (EU law overrides UK law); uncontrolled EU immigration; cost (about £13 billion a year to the EU)"], ["Brexit referendum result?", "Leave won 51.9% to 48.1% on about 72% turnout; young voters mostly Remain, older voters mostly Leave"], ["How did the UK legally leave the EU?", "Invoked Article 50 of the Lisbon Treaty (March 2017); delayed by Northern Ireland border disputes and politics; left in early 2020"], ["Economic impacts of Brexit on the UK?", "GDP about 2.5–3% lower; exports to the EU down as much as 30% from border checks; new trade deals haven't made up the loss"], ["Other impacts of Brexit?", "Free movement ended, but total immigration rose with non-EU workers; UK makes its own laws; harder travel; savings in EU fees wiped out by a weaker economy; rejoined the Horizon research scheme in 2023"], ["Brexit's impact on the EU?", "Lost about 5% of its budget, with smaller economic impact than on the UK; emboldened Eurosceptics (AfD 20% in 2025; Poland and Hungary blocking refugee policy)"], ["Does the EU have its own army or UN vote?", "No; members keep their own foreign policies and militaries, and the EU can't vote in the UN General Assembly"], ["What is the EU's Common Foreign and Security Policy (CFSP)?", "Shared foreign policy guidelines: the European Council sets goals, the Council of the EU implements them, and the European External Action Service handles diplomacy"], ["Four goals of the CFSP?", "Safeguard common EU values and interests; strengthen international security (sanctions, interventions); promote international cooperation (climate, terrorism, refugees); promote democracy, rule of law and human rights"], ["US vs EU foreign policy: similarities?", "Both are broadly interventionist and promote democracy, human rights and international security through economic and military means"], ["US vs EU foreign policy: differences?", "The EU works mainly through diplomacy, aid, sanctions and multilateral forums; the US is far more willing to use military force"], ["What is NATO?", "A transatlantic collective security alliance founded in 1949, now 32 members, headquartered in Brussels"], ["What does Article 5 of NATO say?", "An armed attack on one member is an attack on all; each will assist, including with armed force if needed"], ["Why was NATO created?", "To deter Soviet aggression in the Cold War; US troops in Europe guaranteed US involvement and integrated European militaries"], ["EU members not in NATO?", "Austria, Ireland, Cyprus and Malta"], ["Why do states want to join NATO?", "Collective security guarantees, especially against a perceived Russian threat (e.g. Eastern Europe, Ukraine)"], ["EU humanitarian aid figures?", "The world's biggest donor, about €95.9 billion a year combined (2023), in over 110 countries; Ukraine is the largest single recipient"], ["Is EU aid above the UN target?", "No: about 0.57% of GDP versus the UN's 0.7% target; only a few members exceed it (Luxembourg, Sweden, Germany, Denmark)"]]}, {"name": "Ukraine: Causes", "boss": "The Iron Invader", "cards": [["Ukraine: area and population?", "About 603,000 km² (second-largest country in Europe after Russia); about 37.7 million people"], ["Ukraine: GDP per capita, HDI, Gini?", "About $5,069 per capita; HDI 0.734 (high, 100th of 193); Gini 36.1, so a developing nation"], ["Ukraine's capital, government type and currency?", "Kyiv; semi-presidential republic; hryvnia"], ["Ukraine's key physical geography?", "Mostly flat fertile steppe (\"breadbasket of Europe\"); Carpathian Mountains in the west and Crimean Mountains in the south; the Dnieper river runs through the middle into the Black Sea; borders the Black Sea and Sea of Azov"], ["Languages in Ukraine?", "Ukrainian is official; Russian was official until 1991, and most Ukrainians are bilingual; Russian speakers are concentrated in the urbanised, industrial east and south"], ["Why do some Ukrainians speak Russian natively but not identify as Russian?", "Centuries of Russification and Soviet-era migration spread the language, but national identity is based on citizenship, history and choice, not language"], ["What does \"Ukraine\" mean?", "From the Slavic \"ukraina\", meaning \"borderland\""], ["Why was Kyiv important in the Middle Ages?", "It sat on the Dnieper trade route between the Baltic and Constantinople and was the centre of Kievan Rus (9th–13th centuries)"], ["What happened to Kyiv in 1240?", "Sacked by the Mongols, so power shifted to Moscow; Ukraine was later divided between Mongols, Lithuania and Poland"], ["Who were the Cossacks?", "Frontier horsemen in southern Ukraine (15th–18th centuries) who formed a self-governing state led by an elected hetman at Zaporizhzhia; destroyed by Catherine the Great in 1775"], ["What was Russification?", "Tsarist (and later Soviet) policy suppressing Ukrainian language and culture in favour of Russian, e.g. the 1876 ban on Ukrainian-language books"], ["Who ruled Ukraine in the 19th century?", "Russia ruled the east (about 25 million people); Austria ruled the west (Galicia and Bukovina, about 4 million)"], ["Themes of 19th-century Ukrainian nationalism?", "Peasant (\"plebeian\") democratic identity, Cossack heritage and freedom, and critique of Tsarist oppression (e.g. poet Taras Shevchenko); most wanted federation rather than full independence"], ["When did Ukraine first declare independence?", "22 January 1918 (the Ukrainian People's Republic); defeated by the Bolsheviks and absorbed into the USSR as the Ukrainian SSR in 1921/22"], ["What was the Holodomor?", "Stalin's man-made famine of 1932–33 caused by forced collectivisation; about 4 million deaths, 83% of them ethnic Ukrainians"], ["Soviet industrialisation in Ukraine?", "Industrial output quadrupled by 1939; the Donbas became an industrial hub on its coal fields, drawing hundreds of thousands of Russian workers east"], ["Ukraine in WW2?", "Occupied by Nazi Germany from 1941; about 6 million Ukrainians killed, including 1.5 million Jews; millions deported for forced labour"], ["How did Ukraine's borders change after WW2?", "Parts of Poland, Romania and Slovakia, plus Crimea (1954), were added, forming today's internationally recognised borders"], ["What was Chernobyl?", "The 1986 nuclear reactor explosion in Soviet Ukraine, the worst nuclear disaster in history: 135,000 evacuated and over 5 million exposed to radiation"], ["How did glasnost revive Ukrainian nationalism?", "Less censorship exposed Stalin's atrocities, revived Cossack history and the Ukrainian language, split the church from Moscow, and led to independence protests by 1989"], ["When did Ukraine declare independence from the USSR?", "24 August 1991; confirmed by a 1 December 1991 referendum with 90% in favour on 84% turnout"], ["Problems facing Ukraine in the 1990s?", "Hyperinflation (over 4,700% in 1993); GDP fell by over 60%; oligarchs bought state firms; crime and poverty rose and life expectancy fell"], ["Why did Ukraine's government struggle after independence (Nanivska)?", "In the USSR it just executed Moscow's orders, so it lacked the institutional capacity to make policy despite wanting to go \"the Western way\""], ["What was the Budapest Memorandum (1994)?", "Ukraine gave up about 1,900 Soviet nuclear weapons in exchange for assurances from Russia, the US and UK not to use force against it"], ["Who was Leonid Kuchma?", "President 1994–2004; balanced ties with Russia and the West; increasingly corrupt and authoritarian; the 2000 Cassette Scandal (tapes about ordering a journalist's killing)"], ["Wha ern billionaire president from 2014; signed the EU Association Agreement, pursued NATO, removed Soviet monuments; lost popularity over the war, the economy and corruption"], ["How did Zelenskyy win in 2019?", "As an anti-corruption political outsider (famous for playing the president in \"Servant of the People\"); campaigned on social media, not debates; won about 75%"], ["Why has Zelenskyy been an effective leader?", "Huge mandate across Ukraine including Russian speakers; communicates fluently in Ukrainian, Russian and English; authentic, humble persona; stayed in Kyiv (\"I need ammunition, not a ride\")"], ["What was the 2019 Trump–Zelenskyy scandal?", "Trump allegedly withheld US military aid unless Zelenskyy investigated Joe Biden; Trump was impeached by the House"], ["Russia's 2021 military buildup?", "About 87,000 troops on the border by April 2021, reaching about 100,000 surrounding Ukraine from Russia, Crimea and Belarus by Nov 2021"], ["Possible reasons for Russia's 2021 buildup?", "Response to NATO exercises; claims Ukraine planned to attack the Donbas; Zelenskyy banning pro-Russian TV and parties; warning Biden not to back Ukraine's NATO bid"], ["Why was the 2021 buildup counterproductive (Bieliesko)?", "The more Russia threatened, the more Ukraine wanted NATO; Zelenskyy shifted from ambiguity to full support for NATO"], ["Russia's December 2021 ultimatum to NATO?", "No NATO enlargement (especially Ukraine); no forces in states that joined after 1997; remove intermediate-range missiles; no military activity in Ukraine, Eastern Europe, Caucasus or Central Asia"], ["NATO's response to the ultimatum (Jan 2022)?", "Rejected it: any country may apply and Ukraine is sovereign; demanded Russia withdraw from Ukraine, Georgia and Moldova; the US sent 3,000+ troops to Germany, Poland and Romania"], ["Why is the ultimatum seen as a pretext for war?", "Russia knew NATO would refuse; it bought time to mobilise and let Russia claim it tried diplomacy and that NATO was /* ---------- state ---------- */
const KEY = 'statecraft-v1';
let S = {xp:0, streak:0, last:'', known:{}, best:{}, bosses:{}, sound:true};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
S.conf = S.conf || {}; Object.keys(S.known || {}).forEach(id => { if (S.known[id] && !S.conf[id]) S.conf[id] = 4; });
/* Brainscape-style confidence: 1 not at all … 5 perfectly */
const CONF = [null, ['Not at all','#ff4d6d'], ['Barely','#ff8a3d'], ['Somewhat','#ffd23f'], ['Mostly','#9be15d'], ['Perfectly','#3ddc97']];
const suggestConf = sc => sc >= 85 ? 5 : sc >= 65 ? 4 : sc >= 45 ? 3 : sc >= 20 ? 2 : 1;
const setConf = (id, r) => { S.conf[id] = r; S.known[id] = r >= 4 ? 1 : 0; save(); };
const confRow = (sug=0) => `<div class="confq">How well did you know this?</div><div class="conf" id="conf">${[1,2,3,4,5].map(r => `<button type="button" class="cbtn${r===sug?' sug':''}" data-r="${r}" style="--cc:${CONF[r][1]}"><b>${r}</b><span>${CONF[r][0]}</span></button>`).join('')}</div>`;
const mastery = cards => { const n = cards.length || 1, sum = cards.reduce((t,c) => t + (S.conf[c.id] || 0), 0); return Math.round(100 * sum / (5*n)); };
let sel = new Set([0]);   // selected deck indexes
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pool = () => [...sel].flatMap(d => DECKS[d].cards.map((c,i) => ({d, i, q:c[0], a:c[1], id:d+':'+i})));
const deckLabel = () => sel.size === DECKS.length ? 'All topics' : [...sel].map(d => DECKS[d].name).join(' + ');
const bestKey = m => m + ':' + [...sel].sort().join(',');

/* ---------- streak + xp ---------- */
(function(){ const today = new Date().toDateString(); if (S.last !== today){ const y = new Date(Date.now()-864e5).toDateString(); S.streak = (S.last === y) ? S.streak + 1 : 1; S.last = today; save(); } })();
const levelOf = xp => Math.floor(Math.sqrt(xp/60)) + 1;
const xpFor = l => 60*(l-1)*(l-1);
function paintBar(){
  const l = levelOf(S.xp), a = xpFor(l), b = xpFor(l+1);
  $('#lvl').textContent = 'LV ' + l; $('#xpi').style.width = (100*(S.xp-a)/(b-a)) + '%';
  $('#xpn').textContent = S.xp + ' XP'; $('#streak').textContent = S.streak + '-day streak';
  $('#mute').textContent = S.sound ? 'Sound on' : 'Sound off';
  const at = $('#aitog'); if (at){ at.hidden = !SAMPLE; at.textContent = S.ai === false ? 'AI judge off' : 'AI judge on'; }
}
function gain(n){
  const before = levelOf(S.xp); S.xp += Math.round(n); save(); paintBar();
  const after = levelOf(S.xp);
  if (after > before){ toast('Level up! LV ' + after); confetti(); blip('level'); }
}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1800); }

/* ---------- sound (starts after first tap) ---------- */
let ac = null;
function blip(kind){
  if (!S.sound) return;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  const notes = {good:[660,880], bad:[220,160], level:[523,659,784,1046], hit:[300,520], win:[523,659,784,1046,1318]}[kind] || [440];
  notes.forEach((f,i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = kind==='bad' ? 'sawtooth' : 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, ac.currentTime + i*.07); g.gain.exponentialRampToValueAtTime(.12, ac.currentTime + i*.07 + .01); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + i*.07 + .16);
    o.connect(g).connect(ac.destination); o.start(ac.currentTime + i*.07); o.stop(ac.currentTime + i*.07 + .18); });
}
$('#mute').onclick = () => { S.sound = !S.sound; save(); paintBar(); };
$('#aitog').onclick = () => { S.ai = S.ai === false ? true : false; save(); paintBar(); toast(S.ai === false ? 'AI judge off: keyword marking' : 'AI judge on'); };

/* ---------- confetti ---------- */
const fx = $('#fx'), cx = fx.getContext('2d'); let parts = [], fxOn = false;
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  fx.width = innerWidth; fx.height = innerHeight;
  const cols = ['#ffd23f','#3ddc97','#8b7bff','#ff5d73','#ff8a3d','#eef0ff'];
  for (let i=0;i<140;i++) parts.push({x:innerWidth/2, y:innerHeight/3, vx:(Math.random()-.5)*14, vy:Math.random()*-12-3, r:Math.random()*6+3, c:cols[i%cols.length], a:Math.random()*6});
  if (!fxOn){ fxOn = true; requestAnimationFrame(tick); }
}
function tick(){
  cx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.a += .2; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6); cx.restore(); });
  parts = parts.filter(p => p.y < fx.height + 20);
  if (parts.length) requestAnimationFrame(tick); else { fxOn = false; cx.clearRect(0,0,fx.width,fx.height); }
}

/* ---------- multiple choice helper ---------- */
function makeQ(card){
  const deckCards = DECKS[card.d].cards;
  const others = shuffle(deckCards.map((c,i)=>i).filter(i => i !== card.i)).slice(0,3).map(i => deckCards[i][1]);
  const opts = shuffle([card.a, ...others]);
  return {card, opts, right: opts.indexOf(card.a)};
}
function renderOpts(q, onPick){
  const box = document.createElement('div'); box.className = 'opts';
  q.opts.forEach((t,i) => { const b = document.createElement('button'); b.className = 'opt'; b.type = 'button';
    b.innerHTML = `<kbd>${i+1}</kbd><span>${esc(t)}</span>`; b.onclick = () => onPick(i, box); box.appendChild(b); });
  return box;
}
let keyHandler = null;
const onKeys = fn => { if (keyHandler) document.removeEventListener('keydown', keyHandler); keyHandler = fn; if (fn) document.addEventListener('keydown', fn); };
let timers = [];
let gen = 0;
const clearTimers = () => { gen++; timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = []; };
const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };

const STOP = new Set('about after against also among and because been before being between both but could does down during each from have into just like more most much must only other over same should since some such than that their them then there these they this those through under until very were what when where which while with would your will shall upon onto within without often still every about made make many even the a an and in on of to for its it is as by at or no not all any was are has had can may who how why new one two her his our out yes'.split(' '));

    const lw = w.toLowerCase(), isNum = /\d/.test(w), isCap = /^[A-Z]/.test(w) && w.length > 2;
    if (STOP.has(lw) || /'/.test(w) || !(isNum || isCap || lw.length >= 5)) return;
    const key = keyOf(w); if (seen.has(key)) return; seen.add(key);
    out.push({w, key, isNum, rank: (isNum ? 2 : 0) + (isCap ? 1 : 0)});
  });
  return out.sort((a,b) => b.rank - a.rank).slice(0, 8);
}
function grade(ans, input){
  const ks = keywords(ans), hit = new Set();
  const toks = (input.match(WORD_RE) || []).map(t => /\d/.test(t) ? keyOf(t) : t.toLowerCase());
  ks.forEach(k => { if (toks.some(t => k.isNum ? t === k.key : (t.length >= 4 && (t.slice(0,5) === k.key || k.w.toLowerCase().startsWith(t))))) hit.add(k.key); });
  return {score: ks.length ? hit.size / ks.length : 1, ks, hit};
}

  const keys = new Set(g.ks.map(k => k.key));

  function draw(){
    if (!queue.length){ results('Round complete', mastery(pool()) + '%', 'Mastery of ' + esc(deckLabel()) + ' after ' + done + ' ratings.', [], learn); return; }
    cur = queue.shift(); on = false; gen++;
    app.innerHTML = `<section class="stage">${topBar(`<div><span>MASTERY</span>${mastery(pool())}%</div><div><span>IN ROUND</span>${queue.length+1}</div>`)}

      $('#fc').classList.add('on'); btns.forEach(x => x.disabled = false); $('#rev').disabled = true; $('#ty').disabled = true;
      if (typed){ const my = gen, c0 = cur; $('#ans').style.display = 'none'; $('#vd').innerHTML = thinkingHTML();
        judge(c0, typed).then(j => { if (my !== gen) return; $('#vd').innerHTML = judgeHTML(c0, j); blip(j.verdict === 'incorrect' ? 'bad' : 'good');

      const k = bestKey('recall'), isBest = pts > (S.best[k]||0); if (isBest){ S.best[k] = pts; save(); }
      onKeys(null); results(right >= 6 ? 'Total recall' : 'Recall complete', pts + ' pts', right + ' / ' + qs.length + ' answered well' + (isBest ? ' · new best' : ''), missed, recall); return; }

      hp = Math.max(0, hp - dmg); $('#hp').style.width = hp + '%'; $('#hpn').textContent = hp + ' / 100 HP';
      replay(mon, 'hurt'); replay($('#burst'), 'pop'); if (crit) replay(cam, 'kick');
      float('−' + dmg, crit ? 'crit' : 'dmg'); if (crit) float('CRITICAL!', 'critx'); blip('hit');
    }, 380);
  }
  function bossHits(){
    replay(mon, 'lunge');
    later(() => { hearts--; paintHearts(); replay(hero, 'hurt'); replay(cam, 'quake'); replay($('#vig'), 'flash');
      float('−1 ♥', 'ouch'); blip('bad'); taunt(TAUNTS[Math.floor(Math.random()*TAUNTS.length)]); }, 300);
  }
  function checkEnd(){
    if (hp <= 0 && !over){ over = true; onKeys(null); mon.classList.add('dead'); replay($('#burst'), 'pop'); taunt('Nooooo…');
      later(() => { const st = $('#stamp'); st.textContent = 'DEFEATED'; st.classList.add('show'); }, 500);
      [...sel].forEach(x => S.bosses[x] = 1); save();
      later(() => { confetti(); blip('win'); gain(120); results(name + ' defeated', 'VICTORY', 'You won with ' + hearts + ' heart' + (hearts===1?'':'s') + ' left. +120 XP', missed, boss); }, 1800); return true; }
    if (hearts <= 0 && !over){ over = true; onKeys(null); scene.classList.add('lost'); hero.classList.add('down'); taunt('Too easy.');
      later(() => { const st = $('#stamp'); st.textContent = 'YOU FELL'; st.classList.add('show','bad'); }, 500);
      later(() => { gain(10); results(name + ' wins', 'DEFEAT', 'Study what you missed below, then challenge it again.', missed, boss); }, 1800); return true; }
    return false;
  }
  function ask(){
    if (checkEnd()) return;
    const card = deck[turn % deck.length], special = turn % 3 === 2; turn++; locked = false;
    if (special){
      onKeys(null);
      $('#qa').innerHTML = `<div class="prompt special"><small>Special attack · type the answer · big damage</small>${esc(card.q)}</div>
        <div class="typebox"><textarea id="ty" rows="2" placeholder="Type key terms, names, dates or numbers…"></textarea><button type="button" class="btn gold" id="go">Strike</button></div><div id="fb"></div>`;
      $('#ty').focus({preventScroll:true});
      const cast = async () => { if (locked) return; locked = true; const my = gen;
        $('#ty').disabled = true; $('#go').disabled = true; $('#fb').innerHTML = thinkingHTML(); taunt('Let the judge decide…');
        const j = await judge(card, $('#ty').value); if (my !== gen || over) return;
        $('#fb').innerHTML = judgeHTML(card, j);
        if (passed(j)){ const dmg = Math.min(50, 22 + Math.round(j.score*.25) + combo*3); combo++; $('#cb').textContent = combo; playerHits(dmg, true); }
        else { combo = 0; $('#cb').textContent = 0; missed.push(card); bossHits(); }
        later(ask, 3600); };
      $('#go').onclick = cast; $('#ty').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); cast(); } };
      return;
    }
    const q = makeQ(card);
    $('#qa').innerHTML = `<div class="prompt"><small>${esc(DECKS[card.d].name)} · attack</small>${esc(card.q)}</div>`;
    const box = renderOpts(q, (i, box) => {
      if (locked) return; locked = true;
      const btns = box.querySelectorAll('.opt'); btns[q.right].classList.add('right');
      if (i === q.right){ const dmg = Math.min(30, 12 + combo*4), crit = combo >= 2; combo++; $('#cb').textContent = combo; playerHits(dmg, crit); }
      else { btns[i].classList.add('wrong'); combo = 0; $('#cb').textContent = 0; missed.push(card); bossHits(); }
      later(ask, i === q.right ? 1100 : 1900);
    });
    $('#qa').appendChild(box);
    onKeys(e => { const k = +e.key; if (k >= 1 && k <= 4 && box.isConnected && !locked) box.querySelectorAll('.opt')[k-1].click(); });
  }
  later(ask, 900);
}

/* ---------- 02 blitz ---------- */
function blitz(){
  clearTimers();
  const qs = shuffle(pool()).slice(0, 10).map(makeQ);
  let n = 0, score = 0, combo = 0, correct = 0, missed = [], locked = false;
  function ask(){
    if (n >= qs.length){ const k = bestKey('blitz'), isBest = score > (S.best[k]||0); if (isBest){ S.best[k] = score; save(); }
      gain(20 + correct*4); if (correct >= 8) confetti(); blip('win');
      results(correct >= 8 ? 'Blitzed it' : 'Blitz over', score + ' pts', correct + ' / 10 correct' + (isBest ? ' · new best' : ''), missed, blitz); return; }
    const q = qs[n]; locked = false; let t = 15;
    app.innerHTML = `<section class="stage">${topBar(`<div><span>Q</span>${n+1}/10</div><div><span>SCORE</span><b id="sc">${score}</b></div><div><span>COMBO</span><b class="combo" id="cb">x${(1+combo*.5).toFixed(1)}</b></div>`)}
      <div class="timer"><i id="tm" style="width:100%"></i></div>
      <div class="prompt"><small>${esc(DECKS[q.card.d].name)}</small>${esc(q.card.q)}</div></section>`;
    wireBack();
    const box = renderOpts(q, pick); app.querySelector('.stage').appendChild(box);
    const iv = setInterval(() => { t -= .1; $('#tm').style.width = Math.max(0, t/15*100) + '%'; if (t <= 0){ clearInterval(iv); pick(-1, box); } }, 100); timers.push(iv);
    function pick(i, box){
      if (locked) return; locked = true; clearInterval(iv);
      const btns = box.querySelectorAll('.opt'); btns[q.right].classList.add('right');
      if (i === q.right){ const pts = Math.round((100 + t*10) * (1 + combo*.5)); score += pts; combo++; correct++; blip('good'); $('#cb').classList.add('pop'); }
      else { if (i >= 0) btns[i].classList.add('wrong'); combo = 0; missed.push(q.card); blip('bad'); box.classList.add('shake'); }
      timers.push(setTimeout(() => { n++; ask(); }, i === q.right ? 650 : 1500));
    }
    onKeys(e => { const k = +e.key; if (k >= 1 && k <= 4) pick(k-1, box); });
  }
  ask();
}

/* ---------- 03 match ---------- */
function match(){
  clearTimers();
  const set = shuffle(pool()).slice(0, 6);
  const cut = (t, n) => t.length > n ? t.slice(0, n-1).trimEnd() + '…' : t;
  const tiles = shuffle(set.flatMap((c,k) => [{k, side:'q', t:c.q}, {k, side:'a', t:cut(c.a, 120)}]));
  let first = null, left = 6, t0 = performance.now(), pen = 0, misses = 0;
  app.innerHTML = `<section class="stage">${topBar(`<div><span>TIME</span><b id="clk">0.0s</b></div><div><span>PAIRS LEFT</span><b id="pl">6</b></div>`)}
    <div class="grid" id="grid">${tiles.map((x,i) => `<button type="button" class="tile ${x.side}" data-i="${i}"><i>${x.side==='q' ? 'QUESTION' : 'ANSWER'}</i>${esc(x.t)}</button>`).join('')}</div>
    <p class="hint">Tap a question, then its answer (or the other way round)</p></section>`;
  wireBack();
  const iv = setInterval(() => { $('#clk').textContent = ((performance.now()-t0)/1000 + pen).toFixed(1) + 's'; }, 100); timers.push(iv);
  app.querySelectorAll('.tile').forEach(el => el.onclick = () => {
    const x = tiles[+el.dataset.i];
    if (!first){ first = {el, x}; el.classList.add('sel'); return; }
    if (first.el === el){ el.classList.remove('sel'); first = null; return; }
    if (first.x.side === x.side){ first.el.classList.remove('sel'); first = {el, x}; el.classList.add('sel'); return; }
    if (first.x.k === x.k && first.x.side !== x.side){
      [first.el, el].forEach(e => { e.classList.remove('sel'); e.classList.add('gone'); }); blip('good'); left--; $('#pl').textContent = left;
      S.known[set[x.k].id] = S.known[set[x.k].id] || 0; first = null;
      if (!left){ clearInterval(iv); const secs = (performance.now()-t0)/1000 + pen, k = bestKey('match'), isBest = !S.best[k] || secs < S.best[k];
        if (isBest){ S.best[k] = secs; save(); } gain(30 + Math.max(0, 60 - secs)); confetti(); blip('win');
        timers.push(setTimeout(() => results('Matched!', secs.toFixed(1) + 's', misses + ' wrong pairs' + (isBest ? ' · new best time' : ''), [], match), 500)); }
    } else {
      pen += 3; misses++; blip('bad'); [first.el, el].forEach(e => { e.classList.add('no','shake'); setTimeout(() => e.classList.remove('no','shake','sel'), 400); }); first = null;
    }
  });
}

/* ---------- 05 true / false ---------- */
function tf(){
  clearTimers();
  let t = 60, score = 0, streak = 0, missed = [], cur = null, truth = true;
  const all = pool();
  app.innerHTML = `<section class="stage">${topBar(`<div><span>TIME</span><b id="clk">60</b></div><div><span>CORRECT</span><b id="sc">0</b></div><div><span>STREAK</span><b class="combo" id="st">0</b></div>`)}
    <div class="timer"><i id="tm" style="width:100%"></i></div>
    <div class="tf" id="card"><div class="q" id="q"></div><div class="a" id="a"></div></div>
    <div class="tfrow"><button type="button" class="btn good" id="T">True (←)</button><button type="button" class="btn bad" id="F">False (→)</button></div></section>`;
  wireBack();
  function next(){
    cur = all[Math.floor(Math.random()*all.length)]; truth = Math.random() < .5;
    let shown = cur.a;
    if (!truth){ const dc = DECKS[cur.d].cards; let j; do { j = Math.floor(Math.random()*dc.length); } while (j === cur.i); shown = dc[j][1]; }
    $('#q').textContent = cur.q; $('#a').textContent = shown;
  }
  function call(v){
    if (t <= 0) return;
    if (v === truth){ score++; streak++; blip('good'); $('#sc').textContent = score; $('#st').textContent = streak; $('#st').classList.remove('pop'); void $('#st').offsetWidth; $('#st').classList.add('pop'); }
    else { streak = 0; t -= 3; blip('bad'); missed.push(cur); $('#st').textContent = 0; $('#card').classList.remove('shake'); void $('#card').offsetWidth; $('#card').classList.add('shake'); }
    next();
  }
  $('#T').onclick = () => call(true); $('#F').onclick = () => call(false);
  onKeys(e => { if (e.key === 'ArrowLeft') call(true); if (e.key === 'ArrowRight') call(false); });
  const iv = setInterval(() => { t -= .1; $('#clk').textContent = Math.max(0, Math.ceil(t)); $('#tm').style.width = Math.max(0, t/60*100) + '%';
    if (t <= 0){ clearInterval(iv); const k = bestKey('tf'), isBest = score > (S.best[k]||0); if (isBest){ S.best[k] = score; save(); }
      gain(score*3); if (isBest && score > 5) confetti(); blip('win');
      const seen = new Set(); results("Time's up", score + ' correct', isBest ? 'New best!' : 'Best: ' + (S.best[k]||0), missed.filter(c => !seen.has(c.id) && seen.add(c.id)), tf); } }, 100);
  timers.push(iv); next();
}

$('#logo').onclick = home; $('#logo').onkeydown = e => { if (e.key === 'Enter') home(); };
paintBar(); home();
